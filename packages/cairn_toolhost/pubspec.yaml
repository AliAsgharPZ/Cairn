name: cairn_toolhost
description: >-
  Cairn Tool Host protocol: JSON-RPC (length-prefixed JSON) between the
  studio app and the separate Tool Host process that executes platform
  tools on Windows. Contains the wire protocol, the client (used by the
  app) and the server (used by the host executable).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  cairn_core:
    path: ../cairn_core
  cairn_runtime:
    path: ../cairn_runtime
  cairn_tools:
    path: ../cairn_tools

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
