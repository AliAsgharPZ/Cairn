name: cairn_app
description: "Cairn — a graphical studio for developing AI agents. One identical full studio on Android and Windows, with two-way peer sync and compute overflow."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cairn_core:
    path: ../../packages/cairn_core
  cairn_models:
    path: ../../packages/cairn_models
  cairn_runtime:
    path: ../../packages/cairn_runtime
  cairn_tools:
    path: ../../packages/cairn_tools
  cairn_toolhost:
    path: ../../packages/cairn_toolhost
  cairn_training:
    path: ../../packages/cairn_training
  cairn_sync:
    path: ../../packages/cairn_sync
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Persian primary typeface: Arad (SIL OFL 1.1) — see docs/fonts.md.
  # Static weights are mapped explicitly; the variable font is exposed as its
  # own family for variation-aware surfaces.
  fonts:
    - family: Arad
      fonts:
        - asset: assets/fonts/arad/Arad-Light.ttf
          weight: 300
        - asset: assets/fonts/arad/Arad-Regular.ttf
          weight: 400
        - asset: assets/fonts/arad/Arad-Medium.ttf
          weight: 500
        - asset: assets/fonts/arad/Arad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/arad/Arad-Bold.ttf
          weight: 700
        - asset: assets/fonts/arad/Arad-ExtraBold.ttf
          weight: 800
    - family: AradVF
      fonts:
        - asset: assets/fonts/arad/AradVF.ttf
    - family: AradFD
      fonts:
        - asset: assets/fonts/arad/AradFDVF.ttf
    # Latin companion: Inter (SIL OFL 1.1), variable font.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
