# Cairn: the Flutter template's -Xmx8G default is unrealistic for small build
# machines/CI (our Linux build VM has 8 GB total). 2G is ample for this app;
# raise locally on beefier machines if ever needed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
