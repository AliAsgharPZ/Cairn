name: cairn_tool_host_app
description: >-
  The Cairn Tool Host executable (Windows): a separate process that runs
  platform tools for the studio app over the cairn_toolhost protocol
  (Named Pipe in production, stdio in development).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  cairn_toolhost:
    path: ../packages/cairn_toolhost

dev_dependencies:
  lints: ^4.0.0
