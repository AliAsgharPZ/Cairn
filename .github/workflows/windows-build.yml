# Builds the Cairn Windows binary on a real Windows runner.
# The Linux build environment cannot compile Windows Flutter binaries;
# this workflow (or tools/build_windows.ps1 on the owner's PC) produces them.
name: Windows Build
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: ToolHost exe stdio proof (real Windows child-process round trip)
        # The shipped transport is the host child's stdio (the named
        # pipe round trip repeatedly hung in CI — runs 39635044715,
        # 39653424975, 39658461234 — so the pipe is not a build gate).
        timeout-minutes: 5
        working-directory: packages/cairn_toolhost
        env:
          CAIRN_TOOLHOST_EXE: ${{ runner.temp }}\cairn_tool_host.exe
        run: |
          dart pub get
          dart compile exe bin/cairn_tool_host.dart -o $env:CAIRN_TOOLHOST_EXE
          dart test test/toolhost_exe_stdio_test.dart
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build Windows release
        working-directory: apps/cairn_app
        run: flutter build windows --release
      - name: Compile Tool Host executable (bundled next to the app)
        working-directory: packages/cairn_toolhost
        run: |
          dart pub get
          dart compile exe bin/cairn_tool_host.dart -o ../../apps/cairn_app/build/windows/x64/runner/Release/cairn_tool_host.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-release
          path: apps/cairn_app/build/windows/x64/runner/Release/
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path apps/cairn_app/pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          $release = Resolve-Path apps/cairn_app/build/windows/x64/runner/Release
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$release" "/O$env:RUNNER_TEMP" apps/cairn_app/windows/installer/cairn.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-setup
          path: ${{ runner.temp }}/Cairn-Setup-*.exe

  build-windows-arm64:
    # Windows on ARM64 (Snapdragon laptops etc.): built natively on
    # GitHub's ARM64 Windows runner so Cairn.exe and the Tool Host are
    # real AArch64 binaries, not emulation.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter SDK (manual — flutter-action cannot resolve arm64)
        shell: pwsh
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          echo "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build Windows ARM64 release
        working-directory: apps/cairn_app
        run: flutter build windows --release
      - name: Compile Tool Host executable (bundled next to the app)
        working-directory: packages/cairn_toolhost
        run: |
          dart pub get
          dart compile exe bin/cairn_tool_host.dart -o ../../apps/cairn_app/build/windows/arm64/runner/Release/cairn_tool_host.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-arm64-release
          path: apps/cairn_app/build/windows/arm64/runner/Release/
      - name: Build installer (Inno Setup, ARM64)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path apps/cairn_app/pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          $release = Resolve-Path apps/cairn_app/build/windows/arm64/runner/Release
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DAppSuffix=-arm64" "/DSourceDir=$release" "/O$env:RUNNER_TEMP" apps/cairn_app/windows/installer/cairn.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-setup-arm64
          path: ${{ runner.temp }}/Cairn-Setup-*.exe
