# Builds the Cairn Windows binary on a real Windows runner.
# The Linux build environment cannot compile Windows Flutter binaries;
# this workflow (or tools/build_windows.ps1 on the owner's PC) produces them.
name: windows-build
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: ToolHost exe stdio proof (real Windows child-process round trip)
        # The shipped transport is the host child's stdio (the named
        # pipe round trip repeatedly hung in CI — runs 39635044715,
        # 39653424975, 39658461234 — so the pipe is not a build gate).
        timeout-minutes: 5
        working-directory: packages/cairn_toolhost
        env:
          CAIRN_TOOLHOST_EXE: ${{ runner.temp }}\cairn_tool_host.exe
        run: |
          dart pub get
          dart compile exe bin/cairn_tool_host.dart -o $env:CAIRN_TOOLHOST_EXE
          dart test test/toolhost_exe_stdio_test.dart
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build Windows release
        working-directory: apps/cairn_app
        run: flutter build windows --release
      - name: Compile Tool Host executable (bundled next to the app)
        working-directory: packages/cairn_toolhost
        run: |
          dart pub get
          dart compile exe bin/cairn_tool_host.dart -o ../../apps/cairn_app/build/windows/x64/runner/Release/cairn_tool_host.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-release
          path: apps/cairn_app/build/windows/x64/runner/Release/
