# Builds the Cairn Linux, macOS and iOS binaries on real runners.
# Added in v0.5.0 when the studio expanded beyond Android + Windows.
# Same app, same Dart codebase; platform folders were scaffolded with
# `flutter create --platforms=linux,macos,ios` and then configured:
#  - macOS Release.entitlements carry network.client AND network.server
#    (the sandboxed release otherwise cannot sync at all),
#  - iOS Info.plist carries NSLocalNetworkUsageDescription (iOS blocks
#    local-network sockets without it),
#  - the Windows Tool Host spawn stays behind its Platform.isWindows
#    guard, so other platforms simply run their tools locally.
name: Platforms Build
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      LINUX_ARCH: x64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build Linux release
        working-directory: apps/cairn_app
        run: flutter build linux --release
      - name: Package (tar.gz with .desktop entry + icon)
        run: |
          VER=$(grep '^version:' apps/cairn_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUNDLE=$(ls -d apps/cairn_app/build/linux/*/release/bundle)
          file "$BUNDLE/cairn"
          cp apps/cairn_app/linux/icon.png "$BUNDLE/icon.png"
          printf '%s\n' '[Desktop Entry]' 'Name=Cairn' 'Comment=AI agent & model studio' \
            'Exec=cairn' 'Icon=icon' 'Terminal=false' 'Type=Application' \
            'Categories=Development;' > "$BUNDLE/cairn.desktop"
          tar -czf "cairn-v${VER}-linux-${{ env.LINUX_ARCH }}.tar.gz" -C "$BUNDLE" .
          ls -la "cairn-v${VER}-linux-${{ env.LINUX_ARCH }}.tar.gz"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-linux
          path: cairn-v*-linux-${{ env.LINUX_ARCH }}.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build macOS release
        working-directory: apps/cairn_app
        run: flutter build macos --release
      - name: Package (zip + dmg)
        run: |
          VER=$(grep '^version:' apps/cairn_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          APP=apps/cairn_app/build/macos/Build/Products/Release/Cairn.app
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "cairn-v${VER}-macos.zip"
          mkdir dmg-stage && cp -R "$APP" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Cairn ${VER}" -srcfolder dmg-stage \
            -ov -format UDZO "cairn-v${VER}-macos.dmg"
          ls -la cairn-v${VER}-macos.*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-macos
          path: |
            cairn-v*-macos.zip
            cairn-v*-macos.dmg
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build iOS release (no code signing — sideload build)
        working-directory: apps/cairn_app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (Payload/Runner.app)
        run: |
          VER=$(grep '^version:' apps/cairn_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          APP=apps/cairn_app/build/ios/iphoneos/Runner.app
          test -d "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "cairn-v${VER}-ios-unsigned.ipa" Payload
          ls -la "cairn-v${VER}-ios-unsigned.ipa"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-ios
          path: cairn-v*-ios-unsigned.ipa
          if-no-files-found: error

  build-linux-arm64:
    # Linux on ARM64 (Raspberry Pi, ARM servers/laptops): built
    # natively on GitHub's ARM runner — a real AArch64 bundle.
    runs-on: ubuntu-24.04-arm
    env:
      LINUX_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter SDK (manual — flutter-action cannot resolve arm64)
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Test
        working-directory: apps/cairn_app
        run: flutter test
      - name: Build Linux ARM64 release
        working-directory: apps/cairn_app
        run: flutter build linux --release
      - name: Package (tar.gz with .desktop entry + icon)
        run: |
          VER=$(grep '^version:' apps/cairn_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUNDLE=$(ls -d apps/cairn_app/build/linux/*/release/bundle)
          file "$BUNDLE/cairn"
          cp apps/cairn_app/linux/icon.png "$BUNDLE/icon.png"
          printf '%s\n' '[Desktop Entry]' 'Name=Cairn' 'Comment=AI agent & model studio' \
            'Exec=cairn' 'Icon=icon' 'Terminal=false' 'Type=Application' \
            'Categories=Development;' > "$BUNDLE/cairn.desktop"
          tar -czf "cairn-v${VER}-linux-arm64.tar.gz" -C "$BUNDLE" .
          ls -la "cairn-v${VER}-linux-arm64.tar.gz"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-linux-arm64
          path: cairn-v*-linux-arm64.tar.gz
          if-no-files-found: error
