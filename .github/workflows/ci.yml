# Cairn CI (Linux): analyze + test every package and the app, and produce a
# debug APK artifact. The APK job exists because the maintainer's local
# sandbox cannot run Gradle (its cross-process loopback TCP is blocked by
# policy — see PROGRESS.md); CI is the honest build route for binaries until
# the project is built on a regular machine.
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  dart-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze + test pure-Dart packages
        run: |
          for pkg in cairn_core cairn_models cairn_runtime cairn_tools cairn_toolhost cairn_sync cairn_training; do
            echo "=== $pkg ==="
            (cd packages/$pkg && dart pub get && dart analyze && dart test)
          done

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: App analyze + widget/store tests
        working-directory: apps/cairn_app
        run: flutter analyze && flutter test

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build debug APK
        working-directory: apps/cairn_app
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-debug-apk
          path: apps/cairn_app/build/app/outputs/flutter-apk/app-debug.apk

  android-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Decode release keystore from secrets (skipped when unset)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cairn-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/cairn-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret configured; the release APK will be debug-signed."
          fi
      - name: Verify release signing secrets (fast; prints no secret values)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA256:" \
              && echo "SIGNING VERIFY OK: keystore opens with the configured secrets"
          else
            echo "SIGNING VERIFY SKIPPED: no keystore decoded (debug-signed build)"
          fi
      - name: Build release APKs (split per ABI)
        working-directory: apps/cairn_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Upload arm64 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-apk-arm64
          path: apps/cairn_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Build UNIVERSAL release APK (all ABIs in one file)
        working-directory: apps/cairn_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Upload universal release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-release-apk-universal
          path: apps/cairn_app/build/app/outputs/flutter-apk/app-release.apk
